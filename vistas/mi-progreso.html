<section class="progreso-page">
    <div class="progreso-header">
        <div>
            <h1>Mi Progreso Académico</h1>
            <p id="progreso-subtitulo">Historial de evaluaciones y desarrollos en COMPLEXLAB</p>
        </div>
        <button type="button" class="btn-volver" onclick="mostrarInicioPrincipal(false)">
            ← Volver al inicio
        </button>
    </div>

    <!-- Resumen rápido -->
    <div class="progreso-stats">
        <div class="stat-card">
            <span class="stat-label">Exámenes realizados</span>
            <strong id="stat-total-examenes">0</strong>
        </div>
        <div class="stat-card">
            <span class="stat-label">Promedio general</span>
            <strong id="stat-promedio">0.0</strong>
        </div>
        <div class="stat-card">
            <span class="stat-label">Desarrollos PDF</span>
            <strong id="stat-total-pdfs">0</strong>
        </div>
    </div>

    <!-- Tabla de Calificaciones -->
    <div class="progreso-seccion">
        <div class="seccion-titulo">
            <h2>Historial de Evaluaciones</h2>
            <button type="button" id="btn-limpiar-historial" class="btn-peligro">
                Borrar historial
            </button>
        </div>

        <div class="tabla-contenedor">
            <table class="tabla-progreso">
                <thead>
                    <tr>
                        <th>Unidad Temática</th>
                        <th>Intento</th>
                        <th>Calificación</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody id="tabla-calificaciones-body">
                    <tr>
                        <td colspan="4" style="text-align: center;">Cargando historial...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Desarrollos de Simulaciones (PDFs) -->
    <div class="progreso-seccion" style="margin-top: 30px;">
        <div class="seccion-titulo">
            <h2>Desarrollos de Simulaciones Guardados</h2>
        </div>

        <div id="lista-desarrollos" class="desarrollos-grid">
            <p>Cargando desarrollos...</p>
        </div>
    </div>
</section>

<script>
(function () {
    const usuario = sessionStorage.getItem('complexlab_usuario');
    const subtitulo = document.getElementById('progreso-subtitulo');

    if (!usuario) {
        if (typeof abrirInicioSesion === 'function') abrirInicioSesion();
        return;
    }

    if (subtitulo) {
        subtitulo.textContent = `Estudiante: ${usuario}`;
    }

    function formatearFecha(iso) {
        if (!iso) return '—';
        const fecha = new Date(iso);
        return fecha.toLocaleDateString('es-MX', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    async function cargarCalificaciones() {
        const tbody = document.getElementById('tabla-calificaciones-body');
        try {
            const res = await fetch(`/api/progreso/${encodeURIComponent(usuario)}`, {
                cache: 'no-store'
            });
            const datos = await res.json();

            document.getElementById('stat-total-examenes').textContent = datos.length;

            if (datos.length === 0) {
                document.getElementById('stat-promedio').textContent = '0.0';
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center;">
                            Aún no tienes calificaciones guardadas.
                        </td>
                    </tr>
                `;
                return;
            }

            const suma = datos.reduce((acc, item) => acc + Number(item.calificacion), 0);
            const promedio = (suma / datos.length).toFixed(2);
            document.getElementById('stat-promedio').textContent = `${promedio} / 10`;

            tbody.innerHTML = datos.map(item => {
                const calif = Number(item.calificacion);
                const claseColor = calif >= 8 ? 'nota-alta' : calif >= 6 ? 'nota-media' : 'nota-baja';
                return `
                    <tr>
                        <td>${item.unidad_tematica}</td>
                        <td>#${item.numero_de_intento}</td>
                        <td><span class="badge-nota ${claseColor}">${calif.toFixed(2)} / 10</span></td>
                        <td>${formatearFecha(item.fecha_de_guardado)}</td>
                    </tr>
                `;
            }).join('');
        } catch (error) {
            console.error('Error cargando calificaciones:', error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center;">Error al cargar el historial.</td>
                </tr>
            `;
        }
    }

    async function cargarDesarrollos() {
        const contenedor = document.getElementById('lista-desarrollos');
        try {
            const res = await fetch(`/api/desarrollos/${encodeURIComponent(usuario)}`, {
                cache: 'no-store'
            });
            const datos = await res.json();

            document.getElementById('stat-total-pdfs').textContent = datos.length;

            if (datos.length === 0) {
                contenedor.innerHTML = '<p>Aún no has guardado desarrollos desde las simulaciones.</p>';
                return;
            }

            contenedor.innerHTML = datos.map(dev => `
                <div class="tarjeta-desarrollo">
                    <h3>${dev.simulacion_id}</h3>
                    <p><strong>ID Desarrollo:</strong> ${dev.desarrollo_id}</p>
                    <p><strong>Guardado:</strong> ${formatearFecha(dev.fecha_de_guardado)}</p>
                    ${dev.ruta_pdf
                        ? `<a href="${dev.ruta_pdf}" target="_blank" rel="noopener" class="btn-ver-pdf">Abrir PDF</a>`
                        : '<span class="sin-pdf">Sin archivo adjunto</span>'}
                </div>
            `).join('');
        } catch (error) {
            console.error('Error cargando desarrollos:', error);
            contenedor.innerHTML = '<p>Error al cargar los desarrollos guardados.</p>';
        }
    }

    const btnLimpiar = document.getElementById('btn-limpiar-historial');
    if (btnLimpiar) {
        btnLimpiar.addEventListener('click', async () => {
            if (!confirm('¿Seguro que deseas eliminar todo tu historial de calificaciones?')) return;

            try {
                const res = await fetch(`/api/progreso/${encodeURIComponent(usuario)}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    cargarCalificaciones();
                }
            } catch (error) {
                alert('No se pudo eliminar el historial.');
            }
        });
    }

    cargarCalificaciones();
    cargarDesarrollos();
})();
</script>
