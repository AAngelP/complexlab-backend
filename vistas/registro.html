
<section class="auth-page">
    <div class="auth-card">
        <h1>Crear cuenta</h1>
        <p class="auth-subtitle">Regístrate en COMPLEXLAB con tu correo @gmail.com</p>

        <form id="form-registro" class="auth-form" novalidate>
            <div class="auth-group">
                <label for="registro-usuario">Nombre de usuario</label>
                <input
                    type="text"
                    id="registro-usuario"
                    name="usuario"
                    placeholder="Ej. estudiante_escom"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="auth-group">
                <label for="registro-correo">Correo electrónico (@gmail.com)</label>
                <input
                    type="email"
                    id="registro-correo"
                    name="correo"
                    placeholder="usuario@gmail.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="auth-group">
                <label for="registro-password">Contraseña</label>
                <input
                    type="password"
                    id="registro-password"
                    name="password"
                    placeholder="Mín. 10 caracteres, mayúscula, minúscula, número y símbolo"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="auth-group">
                <label for="registro-confirmar">Confirmar contraseña</label>
                <input
                    type="password"
                    id="registro-confirmar"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="auth-button">
                Enviar código de verificación
            </button>
        </form>

        <!-- Bloque oculto que se muestra al enviar el código -->
        <div id="bloque-verificacion" class="verificacion-box" style="display: none; margin-top: 20px;">
            <hr style="margin-bottom: 15px; opacity: 0.2;">
            <p id="codigo-temporizador" style="font-weight: 600; margin-bottom: 10px;">
                Código válido por 2:00
            </p>

            <div class="auth-group">
                <label for="registro-codigo">Código de 6 dígitos</label>
                <input
                    type="text"
                    id="registro-codigo"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="000000"
                    style="text-align: center; letter-spacing: 6px; font-size: 1.2rem;"
                >
            </div>

            <button type="button" id="btn-verificar-codigo" class="auth-button" style="margin-top: 10px;">
                Verificar código
            </button>

            <button
                type="button"
                id="btn-reenviar-codigo"
                class="auth-button secondary"
                style="display: none; margin-top: 10px;"
            >
                Reenviar código
            </button>
        </div>

        <p id="registro-mensaje" class="auth-message" role="alert"></p>

        <div class="auth-footer">
            <span>¿Ya tienes cuenta?</span>
            <button type="button" id="ir-login" class="link-button">
                Inicia sesión aquí
            </button>
        </div>
    </div>
</section>
